<!-- index.html Teil 1 -->
<!-- Datei: index.html -->

<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Open World Drive V2</title>

<link rel="stylesheet" href="style.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>


<body>


<div id="game">


<div id="hud">

<h1>OPEN WORLD DRIVE</h1>

<div id="speed">
0 km/h
</div>

<button id="fullscreen">
⛶ Fullscreen
</button>

</div>



<div id="mobileControls">


<button id="left">
◀
</button>


<button id="boost">
BOOST
</button>


<button id="brake">
BRAKE
</button>


<button id="right">
▶
</button>


</div>


</div>



<script>


let scene;
let camera;
let renderer;


let car;


let speed = 0;
let maxSpeed = 2.5;

let acceleration = 0;

let rotation = 0;

let boosting = false;


let keys = {};

let wheels = [];

let ramps = [];





function init(){


scene = new THREE.Scene();

scene.background =
new THREE.Color(0x8bdcff);




camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
5000
);




renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.shadowMap.enabled=true;


document
.getElementById("game")
.appendChild(
renderer.domElement
);





let light =
new THREE.DirectionalLight(
0xffffff,
2
);


light.position.set(
200,
300,
100
);


light.castShadow=true;


scene.add(light);



scene.add(
new THREE.AmbientLight(
0xffffff,
0.6
)
);





createWorld();


createCar();



camera.position.set(
0,
6,
15
);



animate();



}








function createWorld(){



let ground =
new THREE.Mesh(

new THREE.PlaneGeometry(
5000,
5000
),

new THREE.MeshStandardMaterial({
color:0x3b9638
})

);



ground.rotation.x =
-Math.PI/2;


scene.add(ground);






// Straße mit durchgehender Linie


let road =
new THREE.Mesh(

new THREE.BoxGeometry(
50,
0.1,
3000
),

new THREE.MeshStandardMaterial({
color:0x242424
})

);



road.position.y=0.05;


scene.add(road);






let line =
new THREE.Mesh(

new THREE.BoxGeometry(
0.5,
0.03,
3000
),

new THREE.MeshBasicMaterial({
color:0xffff00
})

);



line.position.y=0.12;


scene.add(line);






// Stadt


for(
let x=-400;
x<=400;
x+=80
){


for(
let z=-600;
z<=600;
z+=80
){


if(
Math.abs(x)<80
)
continue;



createBuilding(
x,
z
);



}


}






// Rampen


for(
let i=0;
i<5;
i++
){


createRamp(
0,
-200-i*150
);


}



}








function createBuilding(
x,
z
){


let height =
20+
Math.random()*80;


let building =
new THREE.Mesh(

new THREE.BoxGeometry(
40,
height,
40
),

new THREE.MeshStandardMaterial({

color:
new THREE.Color(
Math.random(),
Math.random(),
Math.random()
)

})

);



building.position.set(
x,
height/2,
z
);



scene.add(building);



}






function createRamp(
x,
z
){


let ramp =
new THREE.Mesh(

new THREE.BoxGeometry(
20,
3,
40
),

new THREE.MeshStandardMaterial({
color:0xff8800
})

);



ramp.rotation.x =
-Math.PI/10;



ramp.position.set(
x,
1,
z
);



scene.add(ramp);


ramps.push(ramp);


}







function createCar(){



car =
new THREE.Group();




// Hauptkörper


let body =
new THREE.Mesh(

new THREE.BoxGeometry(
5,
1.2,
10
),

new THREE.MeshStandardMaterial({
color:0xff1111
})

);



body.position.y=1;


body.castShadow=true;


car.add(body);





// Motorhaube


let hood =
new THREE.Mesh(

new THREE.BoxGeometry(
4.5,
0.3,
3
),

new THREE.MeshStandardMaterial({
color:0xdd0000
})

);



hood.position.set(
0,
1.7,
3
);


car.add(hood);





// Fenster


let windowMesh =
new THREE.Mesh(

new THREE.BoxGeometry(
3.5,
1,
3
),

new THREE.MeshStandardMaterial({
color:0x111111
})

);



windowMesh.position.set(
0,
2,
-1
);


car.add(windowMesh);






// Spoiler


let spoiler =
new THREE.Mesh(

new THREE.BoxGeometry(
6,
0.2,
0.5
),

new THREE.MeshStandardMaterial({
color:0x050505
})

);



spoiler.position.set(
0,
2,
-5
);


car.add(spoiler);





createWheel(-2.5,1,-3);
createWheel(2.5,1,-3);
createWheel(-2.5,1,3);
createWheel(2.5,1,3);



scene.add(car);


}
<!-- index.html Teil 2 -->


function createWheel(
x,
y,
z
){


let wheel =
new THREE.Mesh(

new THREE.CylinderGeometry(
0.9,
0.9,
0.7,
24
),

new THREE.MeshStandardMaterial({
color:0x050505
})

);



wheel.rotation.z =
Math.PI/2;


wheel.position.set(
x,
y,
z
);



car.add(wheel);


wheels.push(wheel);


}







function updateCar(){



// Gas


if(
keys["w"]
){

speed += 0.03;


}



// Rückwärts


if(
keys["s"]
){

speed -= 0.04;


}



// Bremsen


if(
keys[" "]
){

speed *= 0.85;


}




// Boost


if(boosting){

speed +=0.08;

}





// Reibung


if(
!keys["w"] &&
!keys["s"]
&&
!boosting
){

speed*=0.98;


}





speed =
Math.max(
Math.min(
speed,
maxSpeed
),
-1
);






// Lenken



if(
keys["a"]
){

rotation +=
0.03 *
Math.abs(speed);


}



if(
keys["d"]
){

rotation -=
0.03 *
Math.abs(speed);


}




car.rotation.y =
rotation;






// Bewegung mit Physik


car.position.x -=

Math.sin(
rotation
)
*
speed;



car.position.z -=

Math.cos(
rotation
)
*
speed;







// Räder drehen


wheels.forEach(
wheel=>{


wheel.rotation.x +=
speed*0.5;


}

);






// Kamera hinter Auto


let cameraTarget =
new THREE.Vector3(

car.position.x +
Math.sin(rotation)*15,

8,


car.position.z +
Math.cos(rotation)*15

);



camera.position.lerp(
cameraTarget,
0.08
);



camera.lookAt(
car.position
);







document
.getElementById("speed")
.innerHTML =

Math.round(
Math.abs(speed*100)
)
+
" km/h";



}








function animate(){


requestAnimationFrame(
animate
);



updateCar();



renderer.render(
scene,
camera
);



}







// Tastatur


window.addEventListener(
"keydown",
e=>{


keys[
e.key.toLowerCase()
]=true;


}
);



window.addEventListener(
"keyup",
e=>{


keys[
e.key.toLowerCase()
]=false;


}
);







// Handy Steuerung



document
.getElementById("boost")
.ontouchstart =
()=>{

boosting=true;

};



document
.getElementById("boost")
.ontouchend =
()=>{

boosting=false;

};





document
.getElementById("brake")
.ontouchstart =
()=>{

keys[" "]=true;

};



document
.getElementById("brake")
.ontouchend =
()=>{

keys[" "]=false;

};






document
.getElementById("left")
.ontouchstart =
()=>{

keys["a"]=true;

};



document
.getElementById("left")
.ontouchend =
()=>{

keys["a"]=false;

};







document
.getElementById("right")
.ontouchstart =
()=>{

keys["d"]=true;

};



document
.getElementById("right")
.ontouchend =
()=>{

keys["d"]=false;

};







window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth/
window.innerHeight;


camera.updateProjectionMatrix();



renderer.setSize(
window.innerWidth,
window.innerHeight
);


}

);







// Fullscreen


document
.getElementById("fullscreen")
.onclick =
()=>{


if(
document.documentElement.requestFullscreen
){

document.documentElement.requestFullscreen();


}


};






init();


</script>


</body>

</html>
