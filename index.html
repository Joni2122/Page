<!-- index.html Teil 1 -->
<!-- Urban Drive Challenge V3 -->

<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Urban Drive Challenge V3</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>


<body>


<div id="game">


<!-- kleines HUD -->

<div id="hud">

<div id="speed">
0 km/h
</div>

<div id="nitro">
Nitro: 100%
</div>

<button id="fullscreen">
⛶
</button>

</div>




<!-- Lenkrad -->

<div id="steering">

<div id="wheel">

🚗

</div>

</div>





<!-- Pedale -->

<div id="pedals">

<button id="gas">

▲<br>
GAS

</button>


<button id="brake">

▼<br>
BREMSE

</button>

</div>





</div>





<script>


let scene;
let camera;
let renderer;


let car;


let speed = 0;

let steering = 0;

let wheelRotation = 0;


let gas = false;
let brake = false;

let boost = false;



let wheels=[];

let ramps=[];

let buildings=[];


let keys={};





function init(){


scene =
new THREE.Scene();


scene.background =
new THREE.Color(
0x8bdcff
);





camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
5000
);





renderer =
new THREE.WebGLRenderer(
{
antialias:true
}
);



renderer.setSize(
window.innerWidth,
window.innerHeight
);



renderer.shadowMap.enabled=true;



document
.getElementById("game")
.appendChild(
renderer.domElement
);





let sun =
new THREE.DirectionalLight(
0xffffff,
2
);


sun.position.set(
300,
500,
200
);


sun.castShadow=true;


scene.add(sun);



scene.add(
new THREE.AmbientLight(
0xffffff,
0.5
)
);





createWorld();


createCar();



camera.position.set(
0,
7,
15
);



animate();


}









function createWorld(){



// Boden


let ground =
new THREE.Mesh(

new THREE.PlaneGeometry(
5000,
5000
),

new THREE.MeshStandardMaterial(
{
color:0x39913a
}
)

);



ground.rotation.x =
-Math.PI/2;


scene.add(ground);







// Straßen-Netz


createRoad(
0,
0,
40,
2500
);


createRoad(
0,
0,
2500,
40
);



createRoad(
500,
0,
30,
1500
);



createRoad(
-500,
0,
30,
1500
);







// Stadt


for(
let x=-800;
x<=800;
x+=100
){

for(
let z=-800;
z<=800;
z+=100
){


if(
Math.abs(x)<120 &&
Math.abs(z)<120
)
continue;



createBuilding(
x,
z
);



}

}







// Parcours


createRamp(
0,
-250
);


createRamp(
0,
-500
);


createRamp(
100,
-700
);


}







function createRoad(
x,
z,
w,
l
){



let road =
new THREE.Mesh(

new THREE.BoxGeometry(
w,
0.05,
l
),

new THREE.MeshStandardMaterial(
{
color:0x222222
}
)

);



road.position.set(
x,
0.02,
z
);



scene.add(road);






let stripe =
new THREE.Mesh(

new THREE.BoxGeometry(
0.4,
0.02,
l
),

new THREE.MeshBasicMaterial(
{
color:0xffff00
}
)

);



stripe.position.set(
x,
0.06,
z
);



scene.add(stripe);



}








function createBuilding(
x,z
){


let h =
20+
Math.random()*100;



let building =
new THREE.Mesh(

new THREE.BoxGeometry(
45,
h,
45
),

new THREE.MeshStandardMaterial(
{
color:
new THREE.Color(
Math.random(),
Math.random(),
Math.random()
)
}

)

);



building.position.set(
x,
h/2,
z
);


building.castShadow=true;



scene.add(building);



buildings.push(building);



}
  /* index.html Teil 2 */


function createRamp(
x,
z
){


let ramp =
new THREE.Mesh(

new THREE.BoxGeometry(
25,
4,
50
),

new THREE.MeshStandardMaterial(
{
color:0xff8800
}

)

);



ramp.rotation.x =
-Math.PI/8;


ramp.position.set(
x,
2,
z
);



scene.add(ramp);


ramps.push(ramp);


}







function createCar(){


car =
new THREE.Group();




// Karosserie


let body =
new THREE.Mesh(

new THREE.BoxGeometry(
5,
1.3,
10
),

new THREE.MeshStandardMaterial(
{
color:0xff2222,
metalness:0.5,
roughness:0.3
}

)

);



body.position.y=1;



car.add(body);





// Dach


let roof =
new THREE.Mesh(

new THREE.BoxGeometry(
3.5,
1,
4
),

new THREE.MeshStandardMaterial(
{
color:0x111111
}

)

);



roof.position.set(
0,
2,
-0.5
);



car.add(roof);






// Räder


createWheel(
-2.5,
1,
-3
);


createWheel(
2.5,
1,
-3
);


createWheel(
-2.5,
1,
3
);


createWheel(
2.5,
1,
3
);





scene.add(car);



}







function createWheel(
x,
y,
z
){


let wheel =
new THREE.Mesh(

new THREE.CylinderGeometry(
0.9,
0.9,
0.7,
24
),

new THREE.MeshStandardMaterial(
{
color:0x050505
}

)

);



wheel.rotation.z =
Math.PI/2;



wheel.position.set(
x,
y,
z
);



car.add(wheel);


wheels.push(wheel);


}









// Auto Physik


function updateCar(){



if(gas){

speed +=0.03;

}



if(brake){

speed -=0.04;

}



if(boost){

speed +=0.07;

}






speed*=0.985;



speed =
Math.max(
Math.min(
speed,
2.5
),
-0.8
);







// Lenkrad Steuerung


car.rotation.y +=
steering *
speed *
0.02;






car.position.x -=

Math.sin(
car.rotation.y
)
*
speed;



car.position.z -=

Math.cos(
car.rotation.y
)
*
speed;








// Räder drehen


wheels.forEach(
w=>{

w.rotation.x +=
speed*0.5;

}

);






// Kamera


let cam =
new THREE.Vector3(

car.position.x+
Math.sin(
car.rotation.y
)
*15,

7,


car.position.z+
Math.cos(
car.rotation.y
)
*15

);



camera.position.lerp(
cam,
0.08
);



camera.lookAt(
car.position
);






document
.getElementById("speed")
.innerHTML =

Math.round(
Math.abs(speed*80)
)
+
" km/h";



}








// Virtuelles Lenkrad


let wheel =
document.getElementById(
"wheel"
);



let dragging=false;

let startX=0;



wheel.addEventListener(
"touchstart",
e=>{

dragging=true;

startX =
e.touches[0].clientX;

}

);



wheel.addEventListener(
"touchmove",
e=>{


if(!dragging)
return;


let x =
e.touches[0].clientX;


let diff =
x-startX;



steering =
diff/100;


wheelRotation =
diff;



wheel.style.transform =
"rotate("+diff+"deg)";


}

);



wheel.addEventListener(
"touchend",
()=>{


dragging=false;


steering=0;


wheel.style.transform =
"rotate(0deg)";


}

);









// Pedale


document
.getElementById("gas")
.ontouchstart =
()=>{

gas=true;

};



document
.getElementById("gas")
.ontouchend =
()=>{

gas=false;

};





document
.getElementById("brake")
.ontouchstart =
()=>{

brake=true;

};



document
.getElementById("brake")
.ontouchend =
()=>{

brake=false;

};









// Fullscreen


document
.getElementById("fullscreen")
.onclick =
()=>{


if(
document.documentElement.requestFullscreen
){

document.documentElement.requestFullscreen();

}


};








function animate(){


requestAnimationFrame(
animate
);



updateCar();



renderer.render(
scene,
camera
);



}







window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth/
window.innerHeight;


camera.updateProjectionMatrix();



renderer.setSize(
window.innerWidth,
window.innerHeight
);



}
);






init();



</script>


</body>

</html>
